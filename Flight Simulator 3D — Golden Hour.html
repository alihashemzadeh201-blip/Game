<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flight Simulator 3D — Golden Hour</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e14;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  canvas { display: block; }

  .panel {
    position: fixed; background: rgba(8, 12, 18, 0.62); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px; color: #eaf2fb;
    z-index: 10; user-select: none;
  }

  #score { top: 16px; left: 16px; padding: 10px 16px; font-size: 15px; line-height: 1.6; }
  #score b { color: #ffd76a; font-size: 20px; }

  #msg {
    position: fixed; top: 22%; left: 50%; transform: translate(-50%, -50%);
    color: #fff; font-size: 38px; font-weight: 800; text-align: center;
    text-shadow: 0 4px 22px rgba(0,0,0,0.8); opacity: 0; transition: opacity 0.25s;
    z-index: 11; pointer-events: none; white-space: nowrap;
  }
  #warn {
    position: fixed; top: 12%; left: 50%; transform: translateX(-50%);
    color: #ff5252; font-size: 26px; font-weight: 900; letter-spacing: 3px;
    z-index: 11; display: none; animation: blink 0.5s steps(2) infinite;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
  }
  @keyframes blink { 50% { opacity: 0.15; } }

  #instruments { bottom: 16px; right: 16px; padding: 12px 16px; font-size: 13px;
    font-variant-numeric: tabular-nums; line-height: 1.7; min-width: 168px; }
  #instruments .val { float: right; font-weight: 700; color: #9fd8ff; }
  #thrBar { height: 8px; background: #22303f; border-radius: 4px; margin: 6px 0 2px; overflow: hidden; }
  #thrFill { height: 100%; width: 0%; background: linear-gradient(90deg, #3b82f6, #7dd3fc); border-radius: 4px; }
  #gearDot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
    background: #4ade80; margin-right: 6px; box-shadow: 0 0 8px currentColor; }

  #att { position: fixed; bottom: 16px; left: 16px; z-index: 10; border-radius: 50%;
    box-shadow: 0 6px 24px rgba(0,0,0,0.5); }

  #hint { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 16px;
    font-size: 12.5px; color: #9fb0c3; white-space: nowrap; }
  #hint b { color: #d9e6f5; }

  #boot {
    position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
    color: #9fb0c3; font-size: 15px; z-index: 50; letter-spacing: 1px;
    text-shadow: 0 2px 8px #000;
  }
  #err {
    position: fixed; top: 38%; left: 50%; transform: translate(-50%, 0);
    max-width: 84%; color: #ff6b6b; background: rgba(20, 8, 8, 0.9);
    border: 1px solid #ff5252; border-radius: 10px; padding: 14px 18px;
    font: 13px/1.5 Consolas, monospace; white-space: pre-wrap;
    z-index: 100; display: none;
  }
</style>
</head>
<body>

<div id="score" class="panel">RINGS <b id="ringScore">0</b> &nbsp;•&nbsp; BALLOONS <b id="balScore">0</b></div>
<div id="msg"></div>
<div id="warn">STALL</div>

<div id="instruments" class="panel">
  <div>SPD <span class="val" id="spd">0 kt</span></div>
  <div>ALT <span class="val" id="alt">0 ft</span></div>
  <div>V/S <span class="val" id="vs">0 fpm</span></div>
  <div>THR</div>
  <div id="thrBar"><div id="thrFill"></div></div>
  <div style="margin-top:6px"><span id="gearDot"></span><span id="gearTxt">GEAR DOWN</span></div>
</div>

<canvas id="att" width="150" height="150"></canvas>

<div id="hint" class="panel">
  <b>W/S</b> throttle &nbsp; <b>Arrows</b> stick (pull <b>Down</b> to climb) &nbsp; <b>A/D</b> rudder &nbsp;
  <b>G</b> gear &nbsp; <b>Space</b> brake &nbsp; <b>C</b> camera &nbsp; <b>R</b> reset
</div>

<div id="boot">booting flight simulator...</div>
<div id="err"></div>

<script>
/* diagnostics: surface ANY failure on screen (runs before the module) */
(function () {
  const errEl = document.getElementById('err');
  window.bootLog = function (t) {
    const b = document.getElementById('boot');
    if (b) b.textContent = t;
  };
  window.bootDone = function () {
    const b = document.getElementById('boot');
    if (b) b.style.display = 'none';
  };
  window.showErr = function (t) {
    errEl.style.display = 'block';
    errEl.textContent = 'ERROR: ' + t + '\n\n(report this message)';
  };
  addEventListener('error', function (e) {
    if (e.message) showErr(e.message + (e.filename ? ' @ ' + e.filename.split('/').pop() + ':' + e.lineno : ''));
    else if (e.target && e.target.src) showErr('failed to load: ' + e.target.src);
  }, true);
  addEventListener('unhandledrejection', function (e) {
    showErr('async: ' + ((e.reason && e.reason.message) || e.reason));
  });
})();
</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { Sky } from 'three/addons/objects/Sky.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   RENDERER / SCENE / POST
===================================================================== */
bootLog('starting renderer...');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  showErr('WebGL could not start: ' + e.message);
  throw e;
}
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.75));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xdfa87a, 4000, 15000);           // warm golden-hour haze

const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, 0.3, 22000);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.35, 0.6, 0.9));
composer.addPass(new OutputPass());

/* studio reflections (used only on the airplane's glossy materials) */
const pmrem = new THREE.PMREMGenerator(renderer);
const envTex = pmrem.fromScene(new RoomEnvironment(renderer), 0.04).texture;

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

/* =====================================================================
   CANVAS TEXTURES (all procedural — no external files)
===================================================================== */
function canvasTexture(w, h, draw, repeatX, repeatY) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (repeatX) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeatX, repeatY); }
  t.anisotropy = 8;
  return t;
}
const rand = (a, b) => a + Math.random() * (b - a);

/* --- terrain detail: neutral bright grain (multiplied by vertex colors) --- */
const grainTex = canvasTexture(256, 256, (g, w, h) => {
  g.fillStyle = '#e8e8e8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 6500; i++) {
    const v = 200 + (Math.random() * 55 | 0);
    g.fillStyle = 'rgb(' + v + ',' + v + ',' + v + ')';
    g.globalAlpha = rand(0.1, 0.38);
    g.fillRect(Math.random() * w, Math.random() * h, rand(1, 3), rand(1, 3));
  }
  g.globalAlpha = 1;
}, 160, 160);

/* --- runway: asphalt + markings --- */
const runwayTex = canvasTexture(256, 1024, (g, w, h) => {
  g.fillStyle = '#33373c'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 5000; i++) {
    g.fillStyle = Math.random() > 0.5 ? '#3a3e44' : '#2c3036';
    g.globalAlpha = rand(0.1, 0.3);
    g.fillRect(Math.random() * w, Math.random() * h, rand(1, 4), rand(1, 4));
  }
  g.globalAlpha = 1;
  g.fillStyle = '#e8e8e8';
  g.fillRect(6, 0, 4, h); g.fillRect(w - 10, 0, 4, h);        // edge lines
  const dash = 64, gap = 48;
  for (let y = 0; y < h; y += dash + gap) g.fillRect(w / 2 - 3, y, 6, dash); // centerline
  for (const end of [0, 1]) {                                  // threshold "piano keys"
    const y0 = end === 0 ? 10 : h - 10 - 70;
    for (let i = 0; i < 6; i++) g.fillRect(24 + i * 36, y0, 18, 70);
  }
});

/* --- palm frond silhouette (alpha-tested) --- */
const frondTex = (() => {
  const c = document.createElement('canvas');
  c.width = 64; c.height = 128;
  const g = c.getContext('2d');
  g.clearRect(0, 0, 64, 128);
  g.strokeStyle = '#ffffff'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(32, 126); g.lineTo(32, 4); g.stroke();   // rib
  g.lineWidth = 2.4; g.lineCap = 'round';
  for (let y = 10; y < 120; y += 7) {                              // leaflets
    const t = (y - 10) / 110;                                      // 0 tip -> 1 base
    const len = 26 * (1 - Math.abs(t - 0.45) * 1.4) + 6;
    const droop = 5 + t * 9;
    g.beginPath(); g.moveTo(32, y); g.lineTo(32 - len, y + droop); g.stroke();
    g.beginPath(); g.moveTo(32, y); g.lineTo(32 + len, y + droop); g.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  return t;
})();

/* --- tileable ripple NORMAL map for the ocean (canvas, linear space) --- */
function rippleTexture(cells, amp) {
  const S = 256;
  const lat = new Float32Array(cells * cells);
  for (let i = 0; i < lat.length; i++) lat[i] = Math.random();
  const latAt = (x, y) => lat[((y % cells + cells) % cells) * cells + ((x % cells + cells) % cells)];
  const hgt = new Float32Array(S * S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const gx = x / S * cells, gy = y / S * cells;
    const ix = Math.floor(gx), iy = Math.floor(gy), fx = gx - ix, fy = gy - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = latAt(ix, iy), b = latAt(ix + 1, iy), c = latAt(ix, iy + 1), d = latAt(ix + 1, iy + 1);
    hgt[y * S + x] = a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  const img = g.createImageData(S, S);
  for (let y = 0; y < S; y++) for (let x = 0; x < S; x++) {
    const dx = (hgt[y * S + (x + 1) % S] - hgt[y * S + (x - 1 + S) % S]) * amp;
    const dy = (hgt[((y + 1) % S) * S + x] - hgt[((y - 1 + S) % S) * S + x]) * amp;
    const inv = 1 / Math.hypot(dx, dy, 1);
    const i = (y * S + x) * 4;
    img.data[i]     = (-dx * inv * 0.5 + 0.5) * 255;
    img.data[i + 1] = (-dy * inv * 0.5 + 0.5) * 255;
    img.data[i + 2] = (inv * 0.5 + 0.5) * 255;
    img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
  const t = new THREE.CanvasTexture(cv);           // linear color space (normal data)
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}

/* --- irregular cloud puff (many soft blobs merged) --- */
const puffTex = (() => {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  for (let i = 0; i < 16; i++) {
    const x = 64 + rand(-34, 34), y = 70 + rand(-22, 22), r = rand(14, 30);
    const gr = g.createRadialGradient(x, y, 1, x, y, r);
    gr.addColorStop(0, 'rgba(255,255,255,0.55)');
    gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
})();

/* --- soft round glow (sun halo) --- */
function glowTexture(inner, outer) {
  return canvasTexture(128, 128, (g) => {
    const gr = g.createRadialGradient(64, 64, 4, 64, 64, 62);
    gr.addColorStop(0, inner); gr.addColorStop(1, outer);
    g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
  });
}
const haloTex = glowTexture('rgba(255,236,190,0.95)', 'rgba(255,200,120,0)');

/* =====================================================================
   SKY / SUN / CLOUDS  (physical sky shader, low golden-hour sun)
===================================================================== */
const SUN_DIR = new THREE.Vector3(0.62, 0.20, 0.45).normalize();   // ~14 deg elevation

const sky = new Sky();
sky.scale.setScalar(15000);
{
  const u = sky.material.uniforms;
  u.turbidity.value = 8;
  u.rayleigh.value = 1.8;
  u.mieCoefficient.value = 0.006;
  u.mieDirectionalG.value = 0.85;
  u.sunPosition.value.copy(SUN_DIR);
}
scene.add(sky);

const halo = new THREE.Sprite(new THREE.SpriteMaterial({
  map: haloTex, transparent: true, depthWrite: false, fog: false,
  blending: THREE.AdditiveBlending, opacity: 0.85
}));
halo.scale.setScalar(3400);
halo.position.copy(SUN_DIR).multiplyScalar(13800);
halo.material.opacity = 0.6;
scene.add(halo);

scene.add(new THREE.HemisphereLight(0xffd9b8, 0x2e4a56, 0.5));
const sun = new THREE.DirectionalLight(0xffd2a0, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -150; sun.shadow.camera.right = 150;
sun.shadow.camera.top = 150; sun.shadow.camera.bottom = -150;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 800;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 3.5;               // low sun angle needs help on slopes
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

/* puffy cloud clusters drifting slowly */
const clouds = [];
for (let i = 0; i < 18; i++) {
  const cl = new THREE.Group();
  const n = 9 + (Math.random() * 7 | 0);
  for (let j = 0; j < n; j++) {
    const sm = new THREE.SpriteMaterial({
      map: puffTex, transparent: true, depthWrite: false,
      opacity: rand(0.65, 0.95), color: 0xfff0dd, rotation: rand(0, Math.PI * 2)
    });
    const s = new THREE.Sprite(sm);
    s.position.set(rand(-260, 260), rand(-50, 60), rand(-130, 130));
    s.scale.set(rand(170, 480), rand(80, 200), 1);
    cl.add(s);
  }
  cl.position.set(rand(-3600, 3600), rand(430, 850), rand(-3600, 3600));
  cl.userData.vx = rand(2, 6);
  clouds.push(cl); scene.add(cl);
}

/* =====================================================================
   TERRAIN: tropical archipelago (procedural islands + ocean)
===================================================================== */
bootLog('generating islands...');
const clamp01 = t => Math.max(0, Math.min(1, t));
const smoothstep = (a, b, t) => { const x = clamp01((t - a) / (b - a)); return x * x * (3 - 2 * x); };

function hash2(ix, iz) {
  let n = (ix * 374761393 + iz * 668265263) | 0;
  n = Math.imul(n ^ (n >>> 13), 1274126177);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967295;
}
function vnoise(x, z) {
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const ux = fx * fx * (3 - 2 * fx), uz = fz * fz * (3 - 2 * fz);
  const a = hash2(ix, iz), b = hash2(ix + 1, iz), c = hash2(ix, iz + 1), d = hash2(ix + 1, iz + 1);
  return a + (b - a) * ux + (c - a) * uz + (a - b - c + d) * ux * uz;
}
function fbm(x, z, oct) {
  let s = 0, amp = 0.5, f = 1;
  for (let i = 0; i < oct; i++) { s += amp * vnoise(x * f, z * f); amp *= 0.5; f *= 2.03; }
  return s;                                                  // ~0..1
}

/* island layout: main island under the airport, a tall volcano, satellite isles */
const ISLANDS = [
  { x: 0,     z: 0,     r: 2400, base: 16, hill: 90, peak: 260 },   // main
  { x: 3600,  z: 2600,  r: 800,  base: 16, hill: 40, peak: 620 },   // volcano (snow cap)
  { x: -3300, z: 1800,  r: 700,  base: 14, hill: 50, peak: 140 },
  { x: 2600,  z: -2600, r: 600,  base: 14, hill: 45, peak: 120 },
  { x: -2400, z: -2500, r: 550,  base: 14, hill: 40, peak: 100 },
  { x: 900,   z: 3400,  r: 500,  base: 12, hill: 35, peak: 90 },
  { x: -1200, z: 3200,  r: 280,  base: 13, hill: 7,  peak: 0 },     // sandbar (lighthouse)
  { x: 3400,  z: -600,  r: 300,  base: 13, hill: 9,  peak: 0 },     // sandbar
];

function terrainHeight(x, z) {
  let h = -14 + 6 * fbm(x * 0.0009 + 7.3, z * 0.0009 + 2.1, 3);     // sea floor
  for (const isl of ISLANDS) {
    const dx = x - isl.x, dz = z - isl.z;
    const d2 = (dx * dx + dz * dz) / (isl.r * isl.r);
    if (d2 > 9) continue;
    const m = Math.exp(-d2 * 2.2);                                  // 1 center -> 0 edge (steep: real shorelines)
    const hills = fbm(x * 0.0016 + isl.x * 0.01, z * 0.0016 + isl.z * 0.01, 4);
    const ridge = Math.pow(1 - Math.abs(2 * fbm(x * 0.00075 + isl.z * 0.013, z * 0.00075, 4) - 1), 3);
    h += m * (isl.base + hills * isl.hill + ridge * isl.peak) * (0.25 + 0.75 * m);
  }
  const d = Math.hypot(x, z);
  const flat = smoothstep(650, 1500, d);        // airport area (incl. full runway) is flat
  return h * flat + 9 * (1 - flat);             // airport sits on a 9 m green plateau
}

const terGeo = new THREE.PlaneGeometry(10000, 10000, 288, 288);
terGeo.rotateX(-Math.PI / 2);
{
  const p = terGeo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    p.setY(i, terrainHeight(p.getX(i), p.getZ(i)));
  }
  terGeo.computeVertexNormals();
  const nrm = terGeo.attributes.normal;
  const colors = new Float32Array(p.count * 3);
  const SAND = [0.85, 0.76, 0.55], GRASS_A = [0.22, 0.48, 0.22], GRASS_B = [0.44, 0.60, 0.28];
  const ROCK = [0.42, 0.385, 0.35], SNOW = [1.15, 1.15, 1.2];
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), z = p.getZ(i), h = p.getY(i);
    const moist = fbm(x * 0.004 + 3.1, z * 0.004 + 8.7, 3);
    let r = GRASS_A[0] + (GRASS_B[0] - GRASS_A[0]) * moist;
    let g = GRASS_A[1] + (GRASS_B[1] - GRASS_A[1]) * moist;
    let b = GRASS_A[2] + (GRASS_B[2] - GRASS_A[2]) * moist;
    const slope = smoothstep(0.55, 0.78, 1 - nrm.getY(i));          // steep -> rock
    const altRock = smoothstep(140, 230, h) * 0.7;
    const rockAmt = Math.max(slope, altRock);
    r += (ROCK[0] - r) * rockAmt; g += (ROCK[1] - g) * rockAmt; b += (ROCK[2] - b) * rockAmt;
    const snow = smoothstep(430, 560, h);
    r += (SNOW[0] - r) * snow; g += (SNOW[1] - g) * snow; b += (SNOW[2] - b) * snow;
    const sand = 1 - smoothstep(0.5, 2.5, h);                        // beaches hug the waterline
    r += (SAND[0] - r) * sand; g += (SAND[1] - g) * sand; b += (SAND[2] - b) * sand;
    if (h < -3) {                                                    // seabed fades to deep teal
      const deep = Math.min(1, (-3 - h) / 9);
      r += (0.10 - r) * deep; g += (0.28 - g) * deep; b += (0.36 - b) * deep;
    }
    colors[i * 3] = r; colors[i * 3 + 1] = g; colors[i * 3 + 2] = b;
  }
  terGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
}
const terrain = new THREE.Mesh(terGeo,
  new THREE.MeshStandardMaterial({ map: grainTex, roughness: 1, vertexColors: true }));
terrain.receiveShadow = true;
scene.add(terrain);

/* --- ocean: two shimmering layers with scrolling ripple normal maps --- */
const rippleA = rippleTexture(24, 2.2); rippleA.repeat.set(90, 90);
const rippleB = rippleTexture(36, 1.8); rippleB.repeat.set(150, 150);
const water = new THREE.Mesh(
  new THREE.PlaneGeometry(24000, 24000),
  new THREE.MeshPhongMaterial({
    color: 0x14607a, specular: 0x7a5a35, shininess: 300,
    normalMap: rippleA, normalScale: new THREE.Vector2(0.65, 0.65),
    transparent: true, opacity: 0.97
  })
);
water.rotation.x = -Math.PI / 2;
water.position.y = -6;
scene.add(water);
const water2 = new THREE.Mesh(
  new THREE.PlaneGeometry(24000, 24000),
  new THREE.MeshPhongMaterial({
    color: 0x1a6a84, specular: 0x8a6a40, shininess: 420,
    normalMap: rippleB, normalScale: new THREE.Vector2(0.4, 0.4),
    transparent: true, opacity: 0.35, depthWrite: false
  })
);
water2.rotation.x = -Math.PI / 2;
water2.position.y = -5.82;
scene.add(water2);

/* --- palm trees (instanced trunk + crown) --- */
{
  const trunkGeo = new THREE.CylinderGeometry(0.16, 0.3, 5, 6);
  trunkGeo.translate(0, 2.5, 0);
  const frondParts = [];
  for (let i = 0; i < 7; i++) {
    const fg = new THREE.PlaneGeometry(1.15, 3.6);
    fg.rotateX(-Math.PI / 2);                        // horizontal, length along Z
    fg.translate(0, 0, -1.7);                        // base at origin, tip outward
    fg.rotateX(-rand(0.32, 0.62));                   // droop
    fg.rotateY((i / 7) * Math.PI * 2 + rand(-0.25, 0.25));
    frondParts.push(fg);
  }
  const crownGeo = mergeGeometries(frondParts);
  crownGeo.translate(0, 5.05, 0);
  const trunkMat = new THREE.MeshStandardMaterial({ color: 0x8a6a4a, roughness: 1 });
  const crownMat = new THREE.MeshStandardMaterial({
    map: frondTex, alphaTest: 0.45, side: THREE.DoubleSide, color: 0x4a8a3a, roughness: 0.9
  });

  const spots = [];
  let guard = 0;
  while (spots.length < 420 && guard++ < 7000) {
    const x = rand(-3600, 3600), z = rand(-3600, 3600);
    const h = terrainHeight(x, z);
    if (h < 2 || h > 70) continue;
    const sl = Math.abs(terrainHeight(x + 6, z) - h) / 6 + Math.abs(terrainHeight(x, z + 6) - h) / 6;
    if (sl > 0.5) continue;
    if (Math.hypot(x, z) < 820) continue;                            // keep the airport plateau clear
    spots.push([x, h, z]);
  }
  const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, spots.length);
  const crowns = new THREE.InstancedMesh(crownGeo, crownMat, spots.length);
  const dummy = new THREE.Object3D();
  spots.forEach(([x, h, z], i) => {
    dummy.position.set(x, h - 0.2, z);
    dummy.rotation.set(rand(-0.07, 0.07), rand(0, Math.PI * 2), rand(-0.07, 0.07));
    dummy.scale.setScalar(rand(0.8, 1.5));
    dummy.updateMatrix();
    trunks.setMatrixAt(i, dummy.matrix);
    crowns.setMatrixAt(i, dummy.matrix);
  });
  trunks.castShadow = true; crowns.castShadow = true;
  scene.add(trunks, crowns);
}

const MAX_P = 400;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(MAX_P * 3).fill(-9999);
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const pVel = new Float32Array(MAX_P * 3);
const pLife = new Float32Array(MAX_P).fill(0);
const pCol = new Float32Array(MAX_P * 3);
let pNext = 0;
const pMat = new THREE.PointsMaterial({
  size: 1.6, vertexColors: true, transparent: true, opacity: 0.95,
  blending: THREE.AdditiveBlending, depthWrite: false
});
pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));

particles.frustumCulled = false;
scene.add(particles);

function burst(pos, n, speed, r, g, b) {
  for (let i = 0; i < n; i++) {
    const k = pNext; pNext = (pNext + 1) % MAX_P;
    pPos[k * 3] = pos.x; pPos[k * 3 + 1] = pos.y; pPos[k * 3 + 2] = pos.z;
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    const s = speed * (0.35 + Math.random() * 0.65);
    pVel[k * 3] = Math.sin(ph) * Math.cos(th) * s;
    pVel[k * 3 + 1] = Math.cos(ph) * s;
    pVel[k * 3 + 2] = Math.sin(ph) * Math.sin(th) * s;
    pCol[k * 3] = r; pCol[k * 3 + 1] = g; pCol[k * 3 + 2] = b;
    pLife[k] = 1;
  }
}
function updateParticles(dt) {
  for (let k = 0; k < MAX_P; k++) {
    if (pLife[k] <= 0) continue;
    pLife[k] -= dt * 1.1;
    if (pLife[k] <= 0) { pPos[k * 3 + 1] = -9999; continue; }
    pVel[k * 3 + 1] -= 12 * dt;
    pPos[k * 3] += pVel[k * 3] * dt;
    pPos[k * 3 + 1] += pVel[k * 3 + 1] * dt;
    pPos[k * 3 + 2] += pVel[k * 3 + 2] * dt;
  }
  pGeo.attributes.position.needsUpdate = true;
  pGeo.attributes.color.needsUpdate = true;
}

/* =====================================================================
   AUDIO (procedural engine + wind + chimes)
===================================================================== */
let actx = null, eng = null;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    const master = actx.createGain(); master.gain.value = 0.5;
    master.connect(actx.destination);
    const o1 = actx.createOscillator(); o1.type = 'sawtooth';
    const o2 = actx.createOscillator(); o2.type = 'square';
    const g1 = actx.createGain(), g2 = actx.createGain();
    g2.gain.value = 0.35;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    o1.connect(g1); o2.connect(g2); g1.connect(lp); g2.connect(lp); lp.connect(master);
    const nb = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate);
    const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = actx.createBufferSource(); noise.buffer = nb; noise.loop = true;
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 700;
    const wg = actx.createGain(); wg.gain.value = 0;
    noise.connect(bp); bp.connect(wg); wg.connect(master);
    o1.start(); o2.start(); noise.start();
    eng = { o1, o2, g1, lp, wg };
  } catch (e) { actx = null; }
}
addEventListener('keydown', initAudio);
addEventListener('pointerdown', initAudio);

function tone(freq, dur, type, gain, slideTo) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, actx.currentTime);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, actx.currentTime + dur);
  g.gain.setValueAtTime(gain, actx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(actx.currentTime + dur);
}

const V_STALL = 32, V_ROTATE = 38, GEAR_H = 2.05;   // wheel bottoms sit at -2.06
const A_THRUST = 14, DRAG_K = 0.0012, GEAR_DRAG = 2.2;

/* Convention: pitch > 0 = nose up, roll > 0 = bank LEFT, yaw increases turning LEFT.
   Stick feel: pull back (ArrowDown) climbs, ArrowLeft banks (and turns) left. */
const F = {
  mode: 'ground',              // ground | air | crashed
  pos: new THREE.Vector3(0, GEAR_H, -460),
  yaw: 0, pitch: 0, roll: 0,
  v: 0, throttle: 0, rpm: 0,   // rpm lags throttle (engine spool)
  gearT: 1,                    // 1 = fully down, 0 = up
  gearTarget: 1,
  vy: 0,
  brake: false,
  score: { rings: 0, balloons: 0 },
  crashTimer: 0,
  camMode: 'chase',
  shake: 0,
  stalling: false,
  rotateCalled: false,
};
const keys = new Set();
addEventListener('keydown', e => {
  keys.add(e.code);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (e.code === 'KeyG' && F.mode === 'air') {
    F.gearTarget = F.gearTarget > 0.5 ? 0 : 1;
    sGear();
    showMsg(F.gearTarget ? 'Gear down' : 'Gear up', 0.9);
  }
  if (e.code === 'KeyC') F.camMode = F.camMode === 'chase' ? 'cockpit' : 'chase';
  if (e.code === 'KeyR') resetFlight();
});
addEventListener('keyup', e => keys.delete(e.code));

function resetFlight() {
  F.mode = 'ground';
  F.pos.set(0, GEAR_H, -460);
  F.yaw = 0; F.pitch = 0; F.roll = 0;
  F.v = 0; F.throttle = 0; F.rpm = 0; F.vy = 0;
  F.gearT = 1; F.gearTarget = 1;
  F.crashTimer = 0; F.shake = 0; F.stalling = false; F.rotateCalled = false;
  showMsg('Throttle up (W) — pull back (Arrow Down) at 75 kt', 2.4);
}

const msgEl = document.getElementById('msg');
let msgTO = null;
function showMsg(t, hold) {
  msgEl.textContent = t;
  msgEl.style.opacity = 1;
  clearTimeout(msgTO);
  msgTO = setTimeout(() => msgEl.style.opacity = 0, (hold || 1.4) * 1000);
}

function crash(reason) {
  if (F.mode === 'crashed') return;
  F.mode = 'crashed';
  F.crashTimer = 2.4;
  F.shake = 1.4;
  burst(F.pos, 90, 26, 1, 0.55, 0.15);
  burst(F.pos, 50, 12, 0.9, 0.9, 0.9);
  sCrash();
  showMsg(reason + ' — resetting...', 2.2);
}

const fwdVec = () => new THREE.Vector3(
  Math.sin(F.yaw) * Math.cos(F.pitch), Math.sin(F.pitch), Math.cos(F.yaw) * Math.cos(F.pitch));

function stepFlight(dt) {
  const prevY = F.pos.y;
  const groundY = terrainHeight(F.pos.x, F.pos.z);

  // throttle & gear always respond
  if (keys.has('KeyW')) F.throttle = Math.min(1, F.throttle + dt * 0.7);
  if (keys.has('KeyS')) F.throttle = Math.max(0, F.throttle - dt * 0.9);
  F.gearT += (F.gearTarget - F.gearT) * Math.min(1, dt * 2.2);
  F.brake = keys.has('Space');

  if (F.mode === 'crashed') {
    F.crashTimer -= dt;
    if (F.crashTimer <= 0) resetFlight();
    return;
  }

  const drag = DRAG_K * F.v * F.v + GEAR_DRAG * F.gearT * (F.mode === 'air' ? 1 : 0);
  F.rpm += (F.throttle - F.rpm) * Math.min(1, dt * 1.6);   // engine spool lag
  const thrust = A_THRUST * F.rpm * (0.55 + 0.012 * F.v);  // power builds with speed

  if (F.mode === 'ground') {
    const onRunway = Math.abs(F.pos.x) < 16 && Math.abs(F.pos.z) < 505;
    let decel = drag + (onRunway ? 0.4 : 6);            // grass is heavy
    if (F.brake) decel += 12;
    F.v = Math.max(0, F.v + (thrust - decel) * dt);

    // nosewheel steering (responsive at taxi speed, calmer on a fast roll)
    const steer = (keys.has('KeyA') ? 1 : 0) - (keys.has('KeyD') ? 1 : 0);
    F.yaw += steer * Math.min(F.v / 12, 1) * (1.4 / (1 + F.v / 25)) * dt;
    F.yaw += 0.006 * F.rpm * Math.min(F.v / 40, 1) * dt;

    // rotate callout at Vr
    if (F.v >= V_ROTATE && !F.rotateCalled) {
      F.rotateCalled = true;
      showMsg('Rotate! Pull back (Arrow Down)', 1.6);
    }
    // rotation -> liftoff (pull back on the stick)
    if (keys.has('ArrowDown') && F.v > V_ROTATE) {
      F.pitch = Math.min(F.pitch + 0.55 * dt, 0.22);
      if (F.pitch > 0.12) {
        F.mode = 'air';
        showMsg('Positive climb — gear up (G)', 1.8);
      }
    } else {
      F.pitch *= Math.max(0, 1 - dt * 4);
    }
    F.roll *= Math.max(0, 1 - dt * 4);
    const f = fwdVec();
    F.pos.x += f.x * F.v * dt;
    F.pos.z += f.z * F.v * dt;
    F.pos.y = terrainHeight(F.pos.x, F.pos.z) + GEAR_H;
    F.vy = 0;
  } else {
    /* ----- airborne ----- */
    F.v = Math.max(0, F.v + (thrust - drag - 9.8 * Math.sin(F.pitch)) * dt);

    const authority = Math.min(1, F.v / 55 + 0.25);
    const pitchIn = (keys.has('ArrowDown') ? 1 : 0) - (keys.has('ArrowUp') ? 1 : 0);   // stick: pull = climb
    const rollIn = (keys.has('ArrowLeft') ? 1 : 0) - (keys.has('ArrowRight') ? 1 : 0); // roll > 0 = bank LEFT
    F.pitch = THREE.MathUtils.clamp(F.pitch + pitchIn * 1.5 * authority * dt, -0.95, 0.95);

    F.roll = THREE.MathUtils.clamp(F.roll + rollIn * 2.4 * authority * dt, -1.15, 1.15);
    if (!rollIn) F.roll *= Math.max(0, 1 - dt * 0.6);       // gentle auto-level

    // coordinated turn: bank left -> nose sweeps left (yaw increases)
    const rudder = (keys.has('KeyA') ? 1 : 0) - (keys.has('KeyD') ? 1 : 0);
    F.yaw += (12 * Math.tan(F.roll) / Math.max(F.v, 40) + rudder * 0.35) * dt;

    // stall behavior — gentle near the ground so you can still flare
    const lift = (F.v / V_STALL) * (F.v / V_STALL);
    const agl = F.pos.y - terrainHeight(F.pos.x, F.pos.z);
    F.stalling = lift < 1 && F.v > 1;
    if (F.stalling) {
      const noseDown = agl < 25 ? 0.12 : 0.55;
      F.pitch = Math.max(F.pitch - noseDown * dt, -0.35);
    }

    const f = fwdVec();
    F.pos.addScaledVector(f, F.v * dt);
    if (lift < 1) {
      // ground effect: the wing floats on a cushion of air near the surface
      const ge = THREE.MathUtils.clamp(1 - agl / 18, 0, 1);
      F.pos.y -= Math.min((1 - lift) * 9.8, 7) * (1 - ge * 0.75) * dt;
    }
    F.vy = (F.pos.y - prevY) / dt;

    /* ----- touchdown / terrain strike ----- */
    const gy = terrainHeight(F.pos.x, F.pos.z);
    if (F.pos.y <= gy + GEAR_H) {
      F.pos.y = gy + GEAR_H;
      const f2 = fwdVec();
      const ahead = terrainHeight(F.pos.x + f2.x * 12, F.pos.z + f2.z * 12);
      const slope = Math.abs(ahead - gy) / 12;
      const survivable = F.vy > -7 && F.pitch > -0.35 && slope < 0.3;
      if (F.gearT < 0.6) {
        crash('Belly landing! Gear was up');
      } else if (slope >= 0.3) {
        crash('Terrain strike');
      } else if (Math.abs(F.roll) > 0.6) {
        crash('Wing strike! Land wings-level');
      } else if (survivable) {
        F.mode = 'ground';
        F.pitch = 0; F.roll = 0;
        burst(F.pos, 14, 4, 0.85, 0.85, 0.85);
        sLand();
        showMsg(F.vy > -2 ? 'Butter smooth landing!' :
                F.vy > -4 ? 'Touchdown — nice!' : 'Firm landing, but you walked away', 1.8);
      } else {
        crash('Hard impact');
      }
    }
  }
}

/* =====================================================================
   RING / BALLOON LOGIC
===================================================================== */
const prevPos = F.pos.clone();
const tmpN = new THREE.Vector3(), tmpA = new THREE.Vector3(), tmpB = new THREE.Vector3();

function checkFlyThrough() {
  if (F.mode === 'crashed') return;
  for (const r of rings) {
    r.getWorldDirection(tmpN);
    tmpA.copy(prevPos).sub(r.position);
    tmpB.copy(F.pos).sub(r.position);
    const d0 = tmpA.dot(tmpN), d1 = tmpB.dot(tmpN);
    if (d0 * d1 < 0) {
      const t = d0 / (d0 - d1);
      const cx = prevPos.x + (F.pos.x - prevPos.x) * t;
      const cy = prevPos.y + (F.pos.y - prevPos.y) * t;
      const cz = prevPos.z + (F.pos.z - prevPos.z) * t;
      const dist = Math.hypot(cx - r.position.x, cy - r.position.y, cz - r.position.z);
      if (dist < RING_R - 2) {
        F.score.rings++;
        burst(r.position, 40, 14, 0.2, 0.9, 1);
        sRing();
        showMsg('Ring! +1', 1.0);
        r.rotation.y = Math.random() * Math.PI * 2;
        placeAway(r, 400);
      }
    }
  }
  for (const b of balloons) {
    if (!b.visible) {
      b.userData.respawn -= 1;
      if (b.userData.respawn <= 0) { placeAway(b, 350); b.visible = true; }
      continue;
    }
    if (F.pos.distanceTo(b.position) < 10) {
      b.visible = false;
      b.userData.respawn = 180;
      F.score.balloons++;
      burst(b.position, 60, 16, 1, 0.45, 0.3);
      sPop();
      showMsg('Balloon popped! +1', 1.1);
    }
  }
  document.getElementById('ringScore').textContent = F.score.rings;
  document.getElementById('balScore').textContent = F.score.balloons;
}

/* =====================================================================
   CAMERA
===================================================================== */
const camEuler = new THREE.Euler();
const camQuat = new THREE.Quaternion();
const camTargetPos = new THREE.Vector3();
const camLook = new THREE.Vector3();
const chasePos = new THREE.Vector3(0, 5, -475);

function updateCamera(dt) {
  camEuler.set(-F.pitch, F.yaw, -F.roll, 'YXZ');
  camQuat.setFromEuler(camEuler);
  if (F.camMode === 'chase') {
    camTargetPos.set(0, 4.4, -14).applyQuaternion(camQuat).add(F.pos);
    const s = 1 - Math.exp(-5 * dt);
    chasePos.lerp(camTargetPos, s);
    camera.position.copy(chasePos);
    if (F.shake > 0) {
      camera.position.x += (Math.random() - 0.5) * F.shake * 2;
      camera.position.y += (Math.random() - 0.5) * F.shake * 2;
    }
    camLook.set(0, 1.2, 25).applyQuaternion(camQuat).add(F.pos);
    camera.lookAt(camLook);
  } else {
    camera.position.set(0, 1.5, 2.4).applyQuaternion(camQuat).add(F.pos);
    camLook.set(0, 1.2, 60).applyQuaternion(camQuat).add(F.pos);
    camera.lookAt(camLook);
  }
  // keep camera above terrain
  const camGround = terrainHeight(camera.position.x, camera.position.z) + 0.6;
  if (camera.position.y < camGround) camera.position.y = camGround;
}

/* =====================================================================
   HUD: instruments + attitude indicator
===================================================================== */
const att = document.getElementById('att').getContext('2d');
function drawAttitude() {
  const s = 150, c = att, cx = s / 2, cy = s / 2;
  c.clearRect(0, 0, s, s);
  c.save();
  c.beginPath(); c.arc(cx, cy, s / 2 - 3, 0, Math.PI * 2); c.clip();
  c.translate(cx, cy);
  c.rotate(F.roll);   // bank left -> horizon tilts clockwise, like a real AI
  const px = (F.pitch / (Math.PI / 2)) * s * 0.55;
  c.translate(0, px);
  c.fillStyle = '#3a86d8'; c.fillRect(-s * 2, -s * 2.4, s * 4, s * 2.4);
  c.fillStyle = '#8a5a2a'; c.fillRect(-s * 2, 0, s * 4, s * 2.4);
  c.fillStyle = '#fff'; c.fillRect(-s * 2, -1.5, s * 4, 3);
  c.strokeStyle = '#fff'; c.lineWidth = 2;
  for (const deg of [-30, -20, -10, 10, 20, 30]) {
    const y = (deg / 90) * s * 0.55;
    const w = deg % 20 === 0 ? 34 : 20;
    c.beginPath(); c.moveTo(-w / 2, -y); c.lineTo(w / 2, -y); c.stroke();
  }
  c.restore();
  // fixed aircraft symbol
  c.strokeStyle = '#ffd76a'; c.lineWidth = 4; c.lineCap = 'round';
  c.beginPath();
  c.moveTo(cx - 34, cy); c.lineTo(cx - 10, cy); c.lineTo(cx, cy + 8); c.lineTo(cx + 10, cy); c.lineTo(cx + 34, cy);
  c.stroke();
  // bezel
  c.strokeStyle = 'rgba(20,26,34,0.9)'; c.lineWidth = 6;
  c.beginPath(); c.arc(cx, cy, s / 2 - 3, 0, Math.PI * 2); c.stroke();
}

const el = id => document.getElementById(id);
function updateHUD() {
  el('spd').textContent = Math.round(F.v * 1.944) + ' kt';
  el('alt').textContent = Math.round(Math.max(0, F.pos.y - terrainHeight(F.pos.x, F.pos.z)) * 3.281) + ' ft';
  el('vs').textContent = Math.round(F.vy * 196.85) + ' fpm';
  el('thrFill').style.width = Math.round(F.throttle * 100) + '%';
  const down = F.gearT > 0.6;
  el('gearDot').style.background = down ? '#4ade80' : '#ff5252';
  el('gearDot').style.color = down ? '#4ade80' : '#ff5252';
  el('gearTxt').textContent = down ? 'GEAR DOWN' : 'GEAR UP';
  // approach warnings
  const aglNow = F.pos.y - terrainHeight(F.pos.x, F.pos.z);
  let warn = '';
  if (F.mode === 'air') {
    if (F.stalling) warn = 'STALL';
    else if (aglNow < 120 && F.vy < -8) warn = 'SINK RATE';
    else if (aglNow < 60 && F.v < 60 && F.gearT < 0.6) warn = 'GEAR!';
  }
  el('warn').textContent = warn;
  el('warn').style.display = warn ? 'block' : 'none';
  drawAttitude();
}

/* =====================================================================
   MAIN LOOP
===================================================================== */
const clock = new THREE.Clock();
let firstFrame = true;

function animate() {
  requestAnimationFrame(animate);
  let dt = Math.min(clock.getDelta(), 0.033);
  if (!(dt > 0)) dt = 0.016;                              // guard: never divide by zero
  if (firstFrame) { firstFrame = false; bootDone(); }

  prevPos.copy(F.pos);
  stepFlight(dt);
  checkFlyThrough();

  // plane visuals
  plane.visible = F.mode !== 'crashed';
  plane.position.copy(F.pos);
  camEuler.set(-F.pitch, F.yaw, -F.roll, 'YXZ');
  plane.quaternion.setFromEuler(camEuler);
  prop.rotation.z += (3 + F.throttle * 55) * dt;
  propDisc.material.opacity = F.throttle * 0.16;
  gear.position.y = (1 - F.gearT) * 1.35;
  gear.visible = F.gearT > 0.04;
  strobe.material.emissiveIntensity = (performance.now() % 1200 < 90) ? 4 : 0.15;
  F.shake = Math.max(0, F.shake - dt * 1.6);

  // world life: drifting clouds, spinning rings, shimmering ocean
  for (const c of clouds) {
    c.position.x += c.userData.vx * dt;
    if (c.position.x > 3800) c.position.x = -3800;
  }
  for (const r of rings) r.rotation.z += dt * 0.4;
  rippleA.offset.x += dt * 0.010; rippleA.offset.y += dt * 0.006;
  rippleB.offset.x -= dt * 0.007; rippleB.offset.y += dt * 0.011;
  updateParticles(dt);

  // shadow camera follows the plane
  sun.position.copy(F.pos).addScaledVector(SUN_DIR, 220);
  sun.target.position.copy(F.pos);

  // engine sound (follows spooled RPM)
  if (eng) {
    const rpm = 45 + F.rpm * 85 + F.v * 0.22;
    eng.o1.frequency.value = rpm;
    eng.o2.frequency.value = rpm * 1.98;
    eng.g1.gain.value = 0.05 + F.rpm * 0.15;
    eng.lp.frequency.value = 280 + F.rpm * 900 + F.v * 3;
    eng.wg.gain.value = Math.min(0.3, (F.v / 165) * (F.v / 165) * 0.35);
  }

  sky.position.copy(camera.position);          // skybox follows
  updateCamera(dt);
  updateHUD();
  composer.render();
}

bootLog('starting engine...');
showMsg('Throttle up with W — pull back (Arrow Down) at 75 kt', 4);
/* debug/demo: open with #air to start airborne over the lagoon (used for visual testing) */
if (location.hash === '#air') {
  F.mode = 'air';
  F.pos.set(-600, 330, -1400);
  F.yaw = 0.85; F.pitch = 0; F.roll = 0;
  F.v = 65; F.throttle = 0.7; F.rpm = 0.7;
  F.gearT = 0; F.gearTarget = 0;
  chasePos.set(-600, 340, -1420);
}
if (location.hash === '#air2') {
  F.mode = 'air';
  F.pos.set(-3400, 190, 600);
  F.yaw = 1.75; F.pitch = 0; F.roll = 0;
  F.v = 65; F.throttle = 0.7; F.rpm = 0.7;
  F.gearT = 0; F.gearTarget = 0;
  chasePos.set(-3400, 200, 580);
}
if (location.hash === '#probe') {
  setTimeout(() => {
    document.title = JSON.stringify({
      waterInScene: !!water.parent, waterY: water.position.y, waterVisible: water.visible,
      seabedH: terrainHeight(-2900, 600).toFixed(1),
      seabedH2: terrainHeight(-2500, 1000).toFixed(1),
      camY: camera.position.y.toFixed(0)
    });
  }, 3000);
}
animate();
</script>
