<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vehicle Sandbox — Build & Drive</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0d1117; color: #dce3ec; }
  canvas { display: block; position: absolute; inset: 0; }

  /* ---------- Toolbar ---------- */
  #toolbar {
    position: absolute; top: 0; left: 0; bottom: 0; width: 168px;
    background: rgba(16, 21, 28, 0.92); backdrop-filter: blur(8px);
    border-right: 1px solid rgba(255,255,255,0.08);
    padding: 12px 10px; overflow-y: auto; z-index: 20; user-select: none;
  }
  .tb-title { font-size: 14px; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 8px; color: #fff; }
  #modeBadge {
    text-align: center; font-size: 12px; font-weight: 800; letter-spacing: 1px;
    padding: 5px 0; border-radius: 8px; margin-bottom: 12px;
    background: #123a22; color: #4ade80; border: 1px solid #1f5c36;
  }
  body.playing #modeBadge { background: #4a2a10; color: #ffb347; border-color: #7a4a1a; }
  .tb-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: #6b7686; margin: 12px 0 5px; }
  #toolbar button {
    display: block; width: 100%; text-align: left; margin-bottom: 4px;
    background: #1c232e; color: #dce3ec; border: 1px solid rgba(255,255,255,0.07);
    border-radius: 8px; padding: 7px 10px; font-size: 13px; cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
  }
  #toolbar button:hover { background: #26303e; }
  #toolbar button.active { background: #274b73; border-color: #3b82f6; color: #fff; }
  #toolbar button.play { background: #14532d; border-color: #22c55e; color: #86efac; font-weight: 700; }
  #toolbar button.play:hover { background: #166534; }
  #toolbar button.stop { background: #5b1d1d; border-color: #ef4444; color: #fca5a5; font-weight: 700; }
  #toolbar button.danger:hover { background: #5b1d1d; }
  body.playing .build-only { opacity: 0.35; pointer-events: none; }

  /* ---------- Hint bar ---------- */
  #hint {
    position: absolute; bottom: 0; left: 168px; right: 0;
    padding: 8px 16px; font-size: 12.5px; color: #9aa7b8;
    background: rgba(13, 17, 23, 0.85); border-top: 1px solid rgba(255,255,255,0.06);
    z-index: 15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; user-select: none;
  }
  #hint b { color: #d4e2f4; }

  /* ---------- Modal ---------- */
  #modalOverlay {
    position: fixed; inset: 0; background: rgba(4, 7, 11, 0.7); backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #modal {
    width: 320px; background: #161d27; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  #modal h3 { font-size: 16px; margin-bottom: 14px; color: #fff; }
  .field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 10px; }
  .field label { font-size: 13px; color: #aeb9c8; }
  .keycap {
    width: 130px; text-align: center; background: #0d1219; color: #7dd3fc;
    border: 1px dashed #3b82f6; border-radius: 8px; padding: 7px 8px;
    font-size: 13px; font-weight: 700; cursor: pointer; outline: none;
  }
  .keycap:focus { border-style: solid; }
  .field input[type="number"] {
    width: 130px; background: #0d1219; color: #fff; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 7px 8px; font-size: 13px; outline: none;
  }
  .modal-btns { display: flex; gap: 8px; margin-top: 16px; }
  .modal-btns button { flex: 1; padding: 9px 0; border-radius: 8px; border: none;
    font-size: 13px; font-weight: 700; cursor: pointer; }
  #modalCancel { background: #2a3442; color: #cbd5e1; }
  #modalOk { background: #3b82f6; color: #fff; }
  #modalOk:hover { background: #2563eb; }
  .modal-note { font-size: 11px; color: #7c8798; margin-top: 10px; line-height: 1.5; }
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="toolbar">
  <div class="tb-title">VEHICLE SANDBOX</div>
  <div id="modeBadge">BUILD MODE</div>

  <div class="tb-label build-only">Add Parts</div>
  <button data-part="chassis" class="build-only">+ Chassis (rect)</button>
  <button data-part="box" class="build-only">+ Box (square)</button>
  <button data-part="wheel" class="build-only">+ Wheel (circle)</button>

  <div class="tb-label build-only">Tools</div>
  <button data-tool="move" class="build-only active">Move (1)</button>
  <button data-tool="rotate" class="build-only">Rotate (2)</button>
  <button data-tool="resize" class="build-only">Resize (3)</button>
  <button data-tool="pin" class="build-only">Pin Joint (4)</button>
  <button data-tool="motor" class="build-only">Motor (5)</button>
  <button data-tool="piston" class="build-only">Piston (6)</button>
  <button data-tool="rope" class="build-only">Rope (7)</button>
  <button data-tool="delete" class="build-only danger">Delete (8)</button>

  <div class="tb-label">Simulation</div>
  <button id="playBtn" class="play">Play</button>
  <button id="undoBtn" class="build-only">Undo (Ctrl+Z)</button>
  <button id="redoBtn" class="build-only">Redo</button>
  <button id="saveBtn" class="build-only">Save JSON</button>
  <button id="loadBtn" class="build-only">Load JSON</button>
  <button id="clearBtn" class="build-only danger">Clear All</button>
</div>

<div id="hint"></div>
<input type="file" id="fileInput" accept=".json,application/json" style="display:none">

<div id="modalOverlay">
  <div id="modal">
    <h3 id="modalTitle">Settings</h3>
    <div class="field"><label id="lblK1">Key 1</label><input id="key1" class="keycap" readonly placeholder="click, then press a key"></div>
    <div class="field"><label id="lblK2">Key 2</label><input id="key2" class="keycap" readonly placeholder="click, then press a key"></div>
    <div class="field"><label id="lblNum">Value</label><input id="numVal" type="number" step="0.5"></div>
    <div class="modal-btns">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk">Create</button>
    </div>
    <div class="modal-note" id="modalNote"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
'use strict';
const { Engine, Bodies, Body, Composite, Constraint, Vector, Vertices } = Matter;

/* =====================================================================
   1. ENGINE & WORLD
===================================================================== */
const engine = Engine.create();
engine.gravity.y = 0;                       // Build mode: zero gravity
const world = engine.world;

let mode = 'build';                         // 'build' | 'play'
let prePlayState = null;                    // JSON snapshot for Stop/Build reset

const GROUND_Y = 430;
const ground = Bodies.rectangle(0, GROUND_Y + 30, 20000, 60, {
  isStatic: true, friction: 1, restitution: 0, label: 'ground'
});
ground.custom = { id: 'ground', type: 'ground' };
Composite.add(world, ground);

/* =====================================================================
   2. CAMERA & COORDINATE TRANSFORMS
===================================================================== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let cw = 0, ch = 0, dpr = 1;
const camera = { x: 0, y: 170, zoom: 1 };

function resizeCanvas() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cw = innerWidth; ch = innerHeight;
  canvas.width = cw * dpr; canvas.height = ch * dpr;
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
}
addEventListener('resize', resizeCanvas);
resizeCanvas();

function screenToWorld(sx, sy) {
  return { x: (sx - cw / 2) / camera.zoom + camera.x,
           y: (sy - ch / 2) / camera.zoom + camera.y };
}
function worldToScreen(wx, wy) {
  return { x: (wx - camera.x) * camera.zoom + cw / 2,
           y: (wy - camera.y) * camera.zoom + ch / 2 };
}

/* =====================================================================
   3. PART FACTORY  (every body stores custom dimensions)
===================================================================== */
let idCounter = 1;
const PALETTE = { chassis: '#4a9eff', box: '#57c84d', wheel: '#2b2f36', rope: '#9aa0a6' };

function registerBody(body, custom) {
  body.custom = Object.assign({ id: idCounter++ }, custom);
  Composite.add(world, body);
  if (mode === 'build') Body.setStatic(body, true);
  return body;
}
function viewCenter() { return screenToWorld(cw / 2, ch / 2); }

function spawnChassis() {
  const c = viewCenter();
  const b = Bodies.rectangle(c.x, c.y, 150, 50, { friction: 0.4, label: 'chassis' });
  registerBody(b, { type: 'chassis', w: 150, h: 50, color: PALETTE.chassis });
  pushHistory();
}
function spawnBox() {
  const c = viewCenter();
  const b = Bodies.rectangle(c.x, c.y, 50, 50, { friction: 0.4, label: 'box' });
  registerBody(b, { type: 'box', w: 50, h: 50, color: PALETTE.box });
  pushHistory();
}
function spawnWheel() {
  const c = viewCenter();
  const b = Bodies.circle(c.x, c.y, 30, {
    friction: 0.9, frictionStatic: 1, restitution: 0.1, label: 'wheel'
  });
  registerBody(b, { type: 'wheel', r: 30, color: PALETTE.wheel });
  pushHistory();
}

/* Rope: chain of small rectangular segments along a drag line */
let ropeIdCounter = 1;
function createRope(p0, p1, endBodyA, endBodyB) {
  const dist = Math.hypot(p1.x - p0.x, p1.y - p0.y);
  if (dist < 30) return;
  const n = Math.max(2, Math.min(40, Math.round(dist / 14)));
  const segLen = dist / n;
  const ang = Math.atan2(p1.y - p0.y, p1.x - p0.x);
  const ropeId = ropeIdCounter++;
  const segs = [];

  for (let i = 0; i < n; i++) {
    const cx = p0.x + Math.cos(ang) * (i + 0.5) * segLen;
    const cy = p0.y + Math.sin(ang) * (i + 0.5) * segLen;
    const s = Bodies.rectangle(cx, cy, segLen + 1.5, 7, {
      angle: ang, friction: 0.4, label: 'rope'
    });
    registerBody(s, { type: 'rope', w: segLen + 1.5, h: 7, color: PALETTE.rope, ropeId });
    segs.push(s);
  }
  for (let i = 0; i < n - 1; i++) {
    const c = Constraint.create({
      bodyA: segs[i], bodyB: segs[i + 1],
      pointA: { x: segLen / 2, y: 0 }, pointB: { x: -segLen / 2, y: 0 },
      length: 1.5, stiffness: 0.9, damping: 0.1
    });
    c.custom = { type: 'rope', ropeId };
    Composite.add(world, c);
  }
  // Attach rope ends to bodies if the drag started/ended on one
  if (endBodyA) {
    const c = Constraint.create({
      bodyA: endBodyA, bodyB: segs[0],
      pointA: worldToLocal(p0, endBodyA), pointB: { x: -segLen / 2, y: 0 },
      length: 2, stiffness: 0.9, damping: 0.1
    });
    c.custom = { type: 'rope', ropeId };
    Composite.add(world, c);
  }
  if (endBodyB) {
    const c = Constraint.create({
      bodyA: segs[n - 1], bodyB: endBodyB,
      pointA: { x: segLen / 2, y: 0 }, pointB: worldToLocal(p1, endBodyB),
      length: 2, stiffness: 0.9, damping: 0.1
    });
    c.custom = { type: 'rope', ropeId };
    Composite.add(world, c);
  }
  recomputeCollisionGroups();
  pushHistory();
}

/* =====================================================================
   4. GEOMETRY HELPERS
===================================================================== */
function worldToLocal(p, body) {
  const d = Vector.sub(p, body.position);
  return Vector.rotate(d, -body.angle);
}
function localToWorld(lp, body) {
  return Vector.add(body.position, Vector.rotate(lp, body.angle));
}
function distToSegment(p, a, b) {
  const abx = b.x - a.x, aby = b.y - a.y;
  const t = Math.max(0, Math.min(1,
    ((p.x - a.x) * abx + (p.y - a.y) * aby) / Math.max(1e-9, abx * abx + aby * aby)));
  return Math.hypot(p.x - (a.x + abx * t), p.y - (a.y + aby * t));
}
function hitBody(p) {
  const bodies = Composite.allBodies(world);
  for (let i = bodies.length - 1; i >= 0; i--) {   // topmost first
    const b = bodies[i];
    if (b.custom && b.custom.type === 'ground') continue;
    if (Vertices.contains(b.vertices, p)) return b;
  }
  return null;
}
/* ALL bodies under a point, topmost first — needed for overlapping parts */
function hitBodiesAt(p) {
  const out = [];
  const bodies = Composite.allBodies(world);
  for (let i = bodies.length - 1; i >= 0; i--) {
    const b = bodies[i];
    if (b.custom && b.custom.type === 'ground') continue;
    if (Vertices.contains(b.vertices, p)) out.push(b);
  }
  return out;
}
function hitConstraint(p) {
  const tol = 9 / camera.zoom;
  for (const c of Composite.allConstraints(world)) {
    if (!c.custom || c.custom.type === 'rope') continue;
    if (!c.bodyA || !c.bodyB) continue;
    const pa = localToWorld(c.pointA, c.bodyA);
    const pb = localToWorld(c.pointB, c.bodyB);
    if (distToSegment(p, pa, pb) < tol) return c;
  }
  return null;
}
/* Connected cluster via constraint graph (BFS) */
function getCluster(root) {
  const adj = new Map();
  for (const c of Composite.allConstraints(world)) {
    if (!c.bodyA || !c.bodyB) continue;
    if (!adj.has(c.bodyA)) adj.set(c.bodyA, []);
    if (!adj.has(c.bodyB)) adj.set(c.bodyB, []);
    adj.get(c.bodyA).push(c.bodyB);
    adj.get(c.bodyB).push(c.bodyA);
  }
  const out = new Set([root]);
  const stack = [root];
  while (stack.length) {
    const b = stack.pop();
    for (const nb of adj.get(b) || []) {
      if (!out.has(nb)) { out.add(nb); stack.push(nb); }
    }
  }
  return [...out];
}

/* Connected parts must NOT collide with each other (overlapping joints
   would otherwise fight the constraint and explode in Play mode).
   Union-find over the constraint graph -> one shared negative collision
   group per connected component. Recomputed after every structural change. */
function recomputeCollisionGroups() {
  const bodies = Composite.allBodies(world).filter(b => b.custom && b.custom.type !== 'ground');
  const parent = new Map(bodies.map(b => [b, b]));
  const find = b => {
    while (parent.get(b) !== b) { parent.set(b, parent.get(parent.get(b))); b = parent.get(b); }
    return b;
  };
  for (const c of Composite.allConstraints(world)) {
    if (!c.bodyA || !c.bodyB || !parent.has(c.bodyA) || !parent.has(c.bodyB)) continue;
    const ra = find(c.bodyA), rb = find(c.bodyB);
    if (ra !== rb) parent.set(ra, rb);
  }
  const sizes = new Map(), groups = new Map();
  for (const b of bodies) {
    const r = find(b);
    sizes.set(r, (sizes.get(r) || 0) + 1);
    if (!groups.has(r)) groups.set(r, Body.nextGroup(true));
  }
  for (const b of bodies) {
    const r = find(b);
    b.collisionFilter.group = sizes.get(r) > 1 ? groups.get(r) : 0;
  }
}

/* =====================================================================
   5. DELETE
===================================================================== */
function deleteBody(body) {
  if (body.custom.type === 'ground') return;
  const ropeId = body.custom.ropeId;
  const bodies = ropeId
    ? Composite.allBodies(world).filter(b => b.custom && b.custom.ropeId === ropeId)
    : [body];
  const doomed = new Set(bodies);
  for (const c of Composite.allConstraints(world)) {
    if (doomed.has(c.bodyA) || doomed.has(c.bodyB) ||
        (ropeId && c.custom && c.custom.ropeId === ropeId)) {
      Composite.remove(world, c);
    }
  }
  for (const b of bodies) Composite.remove(world, b);
  recomputeCollisionGroups();
  pushHistory();
}
function deleteConstraint(c) {
  if (c.custom && c.custom.ropeId) {           // deleting any rope link deletes the rope
    const ropeId = c.custom.ropeId;
    for (const cc of Composite.allConstraints(world))
      if (cc.custom && cc.custom.ropeId === ropeId) Composite.remove(world, cc);
    for (const b of Composite.allBodies(world))
      if (b.custom && b.custom.ropeId === ropeId) Composite.remove(world, b);
  } else {
    Composite.remove(world, c);
  }
  recomputeCollisionGroups();
  pushHistory();
}

/* =====================================================================
   6. SERIALIZATION  (save / load / history)
===================================================================== */
function serialize() {
  const bodies = Composite.allBodies(world)
    .filter(b => b.custom && b.custom.type !== 'ground')
    .map(b => ({
      id: b.custom.id, type: b.custom.type, label: b.label,
      x: b.position.x, y: b.position.y, angle: b.angle,
      w: b.custom.w, h: b.custom.h, r: b.custom.r,
      color: b.custom.color, ropeId: b.custom.ropeId || null
    }));
  const constraints = Composite.allConstraints(world)
    .filter(c => c.bodyA && c.bodyB && c.bodyA.custom && c.bodyB.custom)
    .map(c => ({
      type: c.custom ? c.custom.type : 'pin',
      a: c.bodyA.custom.id, b: c.bodyB.custom.id,
      pointA: { x: c.pointA.x, y: c.pointA.y },
      pointB: { x: c.pointB.x, y: c.pointB.y },
      length: c.length, stiffness: c.stiffness, damping: c.damping || 0,
      fw: c.custom.fw, bw: c.custom.bw, power: c.custom.power,
      extend: c.custom.extend, retract: c.custom.retract, speed: c.custom.speed,
      ropeId: c.custom.ropeId || null
    }));
  return JSON.stringify({ v: 1, bodies, constraints }, null, 2);
}

function loadState(json, opts) {
  const makeStatic = !opts || opts.static !== false;
  let data;
  try { data = JSON.parse(json); } catch (e) { alert('Invalid save file.'); return false; }

  // Clear everything except ground
  for (const c of [...Composite.allConstraints(world)]) Composite.remove(world, c);
  for (const b of Composite.allBodies(world))
    if (b.custom && b.custom.type !== 'ground') Composite.remove(world, b);

  const map = new Map();
  let maxId = 0, maxRope = 0;

  for (const d of data.bodies || []) {
    let b;
    if (d.type === 'wheel') {
      b = Bodies.circle(d.x, d.y, d.r, { friction: 0.9, frictionStatic: 1, restitution: 0.1, label: d.label });
    } else {
      b = Bodies.rectangle(d.x, d.y, d.w, d.h, { friction: 0.4, label: d.label });
    }
    Body.setAngle(b, d.angle || 0);
    b.custom = { id: d.id, type: d.type, w: d.w, h: d.h, r: d.r, color: d.color, ropeId: d.ropeId || undefined };
    Composite.add(world, b);
    if (makeStatic) Body.setStatic(b, true);
    map.set(d.id, b);
    maxId = Math.max(maxId, d.id);
    if (d.ropeId) maxRope = Math.max(maxRope, d.ropeId);
  }

  for (const d of data.constraints || []) {
    const bodyA = map.get(d.a), bodyB = map.get(d.b);
    if (!bodyA || !bodyB) continue;
    const c = Constraint.create({
      bodyA, bodyB, pointA: d.pointA, pointB: d.pointB,
      length: d.length, stiffness: d.stiffness, damping: d.damping || 0
    });
    c.custom = { type: d.type, fw: d.fw, bw: d.bw, power: d.power,
                 extend: d.extend, retract: d.retract, speed: d.speed,
                 ropeId: d.ropeId || undefined };
    Composite.add(world, c);
  }

  idCounter = maxId + 1;
  ropeIdCounter = maxRope + 1;
  recomputeCollisionGroups();
  return true;
}

/* ---------- History (Undo / Redo) ---------- */
const undoStack = [], redoStack = [];
let currentSnapshot = null;
const HISTORY_LIMIT = 60;

function pushHistory(prevSnapshot) {
  undoStack.push(prevSnapshot !== undefined ? prevSnapshot : currentSnapshot);
  if (undoStack.length > HISTORY_LIMIT) undoStack.shift();
  currentSnapshot = serialize();
  redoStack.length = 0;
  try { localStorage.setItem('vehicleSandbox.autosave', currentSnapshot); } catch (e) {}
}
function undo() {
  if (mode !== 'build' || !undoStack.length) return;
  cancelPendingJoint();
  redoStack.push(currentSnapshot);
  currentSnapshot = undoStack.pop();
  loadState(currentSnapshot);
}
function redo() {
  if (mode !== 'build' || !redoStack.length) return;
  cancelPendingJoint();
  undoStack.push(currentSnapshot);
  currentSnapshot = redoStack.pop();
  loadState(currentSnapshot);
}

/* =====================================================================
   7. PLAY MODE  (gravity on, bodies wake, motors & pistons live)
===================================================================== */
const pressed = new Set();
const normKey = k => (k && k.length === 1) ? k.toLowerCase() : k;

addEventListener('keydown', e => {
  if (e.target.classList && e.target.classList.contains('keycap')) return; // binding keys
  const k = normKey(e.key);
  pressed.add(k);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
  if ((e.ctrlKey || e.metaKey) && k === 'z' && !e.shiftKey) { e.preventDefault(); undo(); }
  if ((e.ctrlKey || e.metaKey) && (k === 'y' || (k === 'z' && e.shiftKey))) { e.preventDefault(); redo(); }
  if (k === 'Escape') { cancelPendingJoint(); closeModal(); }
  if (modalOverlay.style.display === 'flex') return;      // typing in a dialog
  if (k === ' ') {
    e.preventDefault();
    if (mode === 'build') enterPlay(); else exitPlay();
    return;
  }
  if (mode === 'build') {
    const tools = ['move', 'rotate', 'resize', 'pin', 'motor', 'piston', 'rope', 'delete'];
    const idx = ['1', '2', '3', '4', '5', '6', '7', '8'].indexOf(k);
    if (idx >= 0) setTool(tools[idx]);
  }
});
addEventListener('keyup', e => pressed.delete(normKey(e.key)));

function applyPlayControls() {
  for (const c of Composite.allConstraints(world)) {
    const cu = c.custom;
    if (!cu || !c.bodyB) continue;
    if (cu.type === 'motor') {
      const spd = (cu.power || 3) * 0.09;
      if (cu.fw && pressed.has(cu.fw)) Body.setAngularVelocity(c.bodyB, spd);
      else if (cu.bw && pressed.has(cu.bw)) Body.setAngularVelocity(c.bodyB, -spd);
    } else if (cu.type === 'piston') {
      if (cu.extend && pressed.has(cu.extend))
        c.length = Math.min(600, c.length + (cu.speed || 2));
      if (cu.retract && pressed.has(cu.retract))
        c.length = Math.max(15, c.length - (cu.speed || 2));
    }
  }
}

function enterPlay() {
  prePlayState = serialize();                 // exact pre-sim snapshot
  mode = 'play';
  document.body.classList.add('playing');
  document.getElementById('modeBadge').textContent = 'PLAY MODE';
  document.getElementById('playBtn').textContent = 'Stop / Build';
  document.getElementById('playBtn').className = 'stop';
  engine.gravity.y = 1;
  for (const b of Composite.allBodies(world)) {
    if (b.custom.type !== 'ground') Body.setStatic(b, false);   // wake up
  }
  cancelPendingJoint();
  setHint();
}
function exitPlay() {
  engine.gravity.y = 0;
  loadState(prePlayState, { static: true });  // restore exact pre-play state
  mode = 'build';
  document.body.classList.remove('playing');
  document.getElementById('modeBadge').textContent = 'BUILD MODE';
  document.getElementById('playBtn').textContent = 'Play';
  document.getElementById('playBtn').className = 'play';
  setHint();
}

/* =====================================================================
   8. JOINT CREATION  (pin / motor / piston)
===================================================================== */
let pendingJoint = null;   // { tool, bodyA, pointA (world) }
let lastMotorCfg = { k1: 'ArrowRight', k2: 'ArrowLeft', num: 3 };
let lastPistonCfg = { k1: 'ArrowUp', k2: 'ArrowDown', num: 2 };

function cancelPendingJoint() { pendingJoint = null; }

/* Snap a click point to a sensible joint location:
   wheels ALWAYS snap to their exact center (perfect axles);
   rects snap when clicked near the middle. */
function snapPointForBody(p, body) {
  if (!body || !body.custom) return p;
  if (body.custom.type === 'wheel') return { x: body.position.x, y: body.position.y };
  if (body.custom.w) {
    const local = worldToLocal(p, body);
    if (Math.abs(local.x) < body.custom.w * 0.2 && Math.abs(local.y) < body.custom.h * 0.2)
      return { x: body.position.x, y: body.position.y };
  }
  return p;
}
function bestSnapPoint(p, a, b) {
  if (a.custom.type === 'wheel') return snapPointForBody(p, a);
  if (b.custom.type === 'wheel') return snapPointForBody(p, b);
  const sb = snapPointForBody(p, b);
  return sb !== p ? sb : snapPointForBody(p, a);
}

function addJointAt(bodyA, bodyB, wp, custom, opts) {
  opts = opts || {};
  const c = Constraint.create({
    bodyA, bodyB,
    pointA: worldToLocal(wp, bodyA), pointB: worldToLocal(wp, bodyB),
    length: opts.length !== undefined ? opts.length : 0,
    stiffness: opts.stiffness !== undefined ? opts.stiffness : 1,
    damping: opts.damping !== undefined ? opts.damping : 0.05
  });
  c.custom = custom;
  Composite.add(world, c);
  recomputeCollisionGroups();
  pushHistory();
}

/* Pin & Motor: both bodies share ONE world anchor point. */
function createPinOrMotor(tool, bodyA, bodyB, wp) {
  if (tool === 'pin') {
    addJointAt(bodyA, bodyB, wp, { type: 'pin' }, { stiffness: 1, damping: 0.05 });
    setHint();
    return;
  }
  // motor: a wheel (if present) always becomes the rotor
  let stator = bodyA, rotor = bodyB;
  if (bodyA.custom.type === 'wheel' && bodyB.custom.type !== 'wheel') { stator = bodyB; rotor = bodyA; }
  openModal({
    title: 'Motor Settings',
    k1: ['Forward key', lastMotorCfg.k1], k2: ['Backward key', lastMotorCfg.k2],
    num: ['Power / Torque', lastMotorCfg.num],
    note: 'Stator: ' + stator.label + ' -> Rotor: ' + rotor.label +
          '. In Play mode, hold the bound keys to spin the rotor.',
    onOk: v => {
      lastMotorCfg = { k1: v.k1, k2: v.k2, num: v.num };
      addJointAt(stator, rotor, wp,
        { type: 'motor', fw: normKey(v.k1), bw: normKey(v.k2), power: v.num },
        { stiffness: 1, damping: 0.1 });
    }
  });
  setHint();
}

function createPiston(bodyA, bodyB, pa, pb) {
  openModal({
    title: 'Hydraulic Piston Settings',
    k1: ['Extend key', lastPistonCfg.k1], k2: ['Retract key', lastPistonCfg.k2],
    num: ['Speed (px/frame)', lastPistonCfg.num],
    note: 'A rigid actuator between the two mount points. In Play mode the bound keys change its length live.',
    onOk: v => {
      lastPistonCfg = { k1: v.k1, k2: v.k2, num: v.num };
      const c = Constraint.create({
        bodyA, bodyB,
        pointA: worldToLocal(pa, bodyA), pointB: worldToLocal(pb, bodyB),
        length: Math.max(15, Math.hypot(pb.x - pa.x, pb.y - pa.y)),
        stiffness: 0.9, damping: 0.2
      });
      c.custom = { type: 'piston', extend: normKey(v.k1), retract: normKey(v.k2), speed: v.num };
      Composite.add(world, c);
      recomputeCollisionGroups();
      pushHistory();
    }
  });
  setHint();
}

function handleJointClick(tool, hits, p) {
  /* ONE-CLICK: an overlap of 2+ parts joints the top two instantly */
  if (!pendingJoint && tool !== 'piston' && hits.length >= 2) {
    createPinOrMotor(tool, hits[0], hits[1], bestSnapPoint(p, hits[0], hits[1]));
    return;
  }
  /* first click: arm the tool */
  if (!pendingJoint) {
    if (!hits.length) { setHint(); return; }
    pendingJoint = { tool, bodyA: hits[0], pointA: p };
    setHint('First body selected — click the <b>second body</b>. ' +
      (tool === 'piston'
        ? 'The piston will span the two click points (a preview line follows your cursor).'
        : 'The joint lands exactly where you click — wheel centers snap automatically.'));
    return;
  }
  /* second click: topmost body that isn't the first one */
  const bodyB = hits.find(b => b !== pendingJoint.bodyA);
  if (!bodyB) {
    setHint('Pick a <b>different</b> body — click where they <b>overlap</b> to grab the one underneath.');
    return;
  }
  const bodyA = pendingJoint.bodyA, pointA = pendingJoint.pointA, armedTool = pendingJoint.tool;
  pendingJoint = null;
  if (armedTool === 'piston') {
    createPiston(bodyA, bodyB, snapPointForBody(pointA, bodyA), snapPointForBody(p, bodyB));
  } else {
    createPinOrMotor(armedTool, bodyA, bodyB, bestSnapPoint(p, bodyA, bodyB));
  }
}

/* =====================================================================
   9. MODAL
===================================================================== */
const modalOverlay = document.getElementById('modalOverlay');
const key1El = document.getElementById('key1'), key2El = document.getElementById('key2');
const numEl = document.getElementById('numVal');
let modalOkCb = null;

const prettyKey = k => k === ' ' ? 'Space' : (k.length === 1 ? k.toUpperCase() : k);
function bindKeycap(el, initial) {
  el.dataset.key = initial; el.value = prettyKey(initial);
  el.onkeydown = e => {
    e.preventDefault(); e.stopPropagation();
    el.dataset.key = e.key; el.value = prettyKey(e.key); el.blur();
  };
}
function openModal(cfg) {
  document.getElementById('modalTitle').textContent = cfg.title;
  document.getElementById('lblK1').textContent = cfg.k1[0];
  document.getElementById('lblK2').textContent = cfg.k2[0];
  document.getElementById('lblNum').textContent = cfg.num[0];
  document.getElementById('modalNote').textContent = cfg.note || '';
  bindKeycap(key1El, cfg.k1[1]); bindKeycap(key2El, cfg.k2[1]);
  numEl.value = cfg.num[1];
  modalOkCb = cfg.onOk;
  modalOverlay.style.display = 'flex';
}
function closeModal() { modalOverlay.style.display = 'none'; modalOkCb = null; }
document.getElementById('modalCancel').addEventListener('click', () => { closeModal(); setHint(); });
document.getElementById('modalOk').addEventListener('click', () => {
  const v = { k1: key1El.dataset.key, k2: key2El.dataset.key, num: parseFloat(numEl.value) || 3 };
  const cb = modalOkCb; closeModal();
  if (cb) cb(v);
});
modalOverlay.addEventListener('mousedown', e => { if (e.target === modalOverlay) { closeModal(); setHint(); } });

/* =====================================================================
   10. MOUSE TOOLS
===================================================================== */
let tool = 'move';
let drag = null;            // active drag state
let panning = null;
let hoverBody = null;
let selectedBody = null;
let ropeDragStart = null;

const cursors = { move: 'grab', rotate: 'crosshair', resize: 'nwse-resize',
  pin: 'pointer', motor: 'pointer', piston: 'pointer', rope: 'crosshair', delete: 'not-allowed' };

function setTool(t) {
  tool = t; cancelPendingJoint(); selectedBody = null; ropeDragStart = null;
  document.querySelectorAll('#toolbar [data-tool]').forEach(b =>
    b.classList.toggle('active', b.dataset.tool === t));
  canvas.style.cursor = cursors[t];
  setHint();
}

canvas.addEventListener('contextmenu', e => e.preventDefault());

canvas.addEventListener('mousedown', e => {
  if (e.button === 1 || e.button === 2) {           // pan
    panning = { x: e.clientX, y: e.clientY };
    canvas.style.cursor = 'grabbing';
    e.preventDefault();
    return;
  }
  if (e.button !== 0 || mode !== 'build') return;
  const p = screenToWorld(e.clientX, e.clientY);
  const body = hitBody(p);

  switch (tool) {
    case 'move':
      if (body) {
        selectedBody = body;
        drag = { kind: 'move', cluster: getCluster(body), last: p, snap: serialize() };
      } else selectedBody = null;
      break;
    case 'rotate':
      if (body) {
        const cluster = getCluster(body);
        drag = { kind: 'rotate', pivot: body, cluster,
          startAng: Math.atan2(p.y - body.position.y, p.x - body.position.x),
          init: cluster.map(b => ({ b, pos: { ...b.position }, angle: b.angle })),
          snap: serialize() };
      }
      break;
    case 'resize':
      if (body && body.custom.type !== 'rope') {
        drag = { kind: 'resize', body, snap: serialize() };
        applyResize(body, p);
      }
      break;
    case 'pin': case 'motor': case 'piston':
      handleJointClick(tool, hitBodiesAt(p), p);
      break;
    case 'rope':
      ropeDragStart = { p, body };
      break;
    case 'delete':
      if (body) { deleteBody(body); selectedBody = null; }
      else { const c = hitConstraint(p); if (c) deleteConstraint(c); }
      break;
  }
});

canvas.addEventListener('mousemove', e => {
  if (panning) {
    camera.x -= (e.clientX - panning.x) / camera.zoom;
    camera.y -= (e.clientY - panning.y) / camera.zoom;
    panning = { x: e.clientX, y: e.clientY };
    return;
  }
  const p = screenToWorld(e.clientX, e.clientY);
  hoverBody = (mode === 'build') ? hitBody(p) : null;
  if (!drag || mode !== 'build') return;

  if (drag.kind === 'move') {
    const d = Vector.sub(p, drag.last);
    if (Math.abs(d.x) > 1e-9 || Math.abs(d.y) > 1e-9) {
      for (const b of drag.cluster) Body.translate(b, d);
      drag.last = p;
    }
  } else if (drag.kind === 'rotate') {
    const pivot = drag.pivot.position;
    const now = Math.atan2(p.y - pivot.y, p.x - pivot.x);
    const dA = now - drag.startAng;
    for (const it of drag.init) {
      const rel = Vector.sub(it.pos, pivot);
      const rot = Vector.rotate(rel, dA);
      Body.setPosition(it.b, Vector.add(pivot, rot));
      Body.setAngle(it.b, it.angle + dA);
    }
  } else if (drag.kind === 'resize') {
    applyResize(drag.body, p);
  }
});

addEventListener('mouseup', e => {
  if (panning) { panning = null; canvas.style.cursor = cursors[tool]; return; }
  if (e.button !== 0) return;

  if (ropeDragStart && mode === 'build') {
    const p = screenToWorld(e.clientX, e.clientY);
    const endBody = hitBody(p);
    createRope(ropeDragStart.p, p,
      ropeDragStart.body, (endBody && endBody !== ropeDragStart.body) ? endBody : null);
    ropeDragStart = null;
  }
  if (drag) {
    pushHistory(drag.snap);       // one history entry per drag
    // Refresh static bodies so stored mass/inertia match resized geometry
    if (drag.kind === 'resize' && mode === 'build') {
      Body.setStatic(drag.body, false);
      Body.setStatic(drag.body, true);
    }
    drag = null;
  }
});

function applyResize(body, p) {
  const MIN = 16;
  if (body.custom.type === 'wheel') {
    const newR = Math.max(8, Math.min(200, Math.hypot(p.x - body.position.x, p.y - body.position.y)));
    const f = newR / body.custom.r;
    if (Math.abs(f - 1) < 1e-4) return;
    Body.scale(body, f, f, body.position);
    scaleConstraintPoints(body, f, f);
    body.custom.r = newR;
  } else {
    const local = worldToLocal(p, body);
    const newW = Math.max(MIN, Math.min(800, Math.abs(local.x) * 2));
    const newH = Math.max(MIN, Math.min(800, Math.abs(local.y) * 2));
    const fx = newW / body.custom.w, fy = newH / body.custom.h;
    if (Math.abs(fx - 1) < 1e-4 && Math.abs(fy - 1) < 1e-4) return;
    Body.scale(body, fx, fy, body.position);
    scaleConstraintPoints(body, fx, fy);
    body.custom.w = newW; body.custom.h = newH;
  }
}
function scaleConstraintPoints(body, fx, fy) {
  for (const c of Composite.allConstraints(world)) {
    if (c.bodyA === body) { c.pointA.x *= fx; c.pointA.y *= fy; }
    if (c.bodyB === body) { c.pointB.x *= fx; c.pointB.y *= fy; }
  }
}

/* Zoom toward cursor */
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const before = screenToWorld(e.clientX, e.clientY);
  const factor = Math.pow(1.0015, -e.deltaY);
  camera.zoom = Math.max(0.15, Math.min(4, camera.zoom * factor));
  camera.x = before.x - (e.clientX - cw / 2) / camera.zoom;
  camera.y = before.y - (e.clientY - ch / 2) / camera.zoom;
}, { passive: false });

/* =====================================================================
   11. RENDERER
===================================================================== */
function drawGrid() {
  const tl = screenToWorld(0, 0), br = screenToWorld(cw, ch);
  const step = 50;
  ctx.lineWidth = 1 / camera.zoom;
  for (let x = Math.floor(tl.x / step) * step; x < br.x; x += step) {
    ctx.strokeStyle = x === 0 ? 'rgba(120,150,190,0.25)' : 'rgba(255,255,255,0.045)';
    ctx.beginPath(); ctx.moveTo(x, tl.y); ctx.lineTo(x, br.y); ctx.stroke();
  }
  for (let y = Math.floor(tl.y / step) * step; y < br.y; y += step) {
    ctx.strokeStyle = y === 0 ? 'rgba(120,150,190,0.25)' : 'rgba(255,255,255,0.045)';
    ctx.beginPath(); ctx.moveTo(tl.x, y); ctx.lineTo(br.x, y); ctx.stroke();
  }
}

function pathBody(b) {
  ctx.beginPath();
  const v = b.vertices;
  ctx.moveTo(v[0].x, v[0].y);
  for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
  ctx.closePath();
}

function drawBody(b) {
  const cu = b.custom;
  if (cu.type === 'ground') {
    pathBody(b);
    ctx.fillStyle = '#181f28'; ctx.fill();
    const tl = screenToWorld(0, 0), br = screenToWorld(cw, ch);
    ctx.strokeStyle = '#2e3a4a'; ctx.lineWidth = 2 / camera.zoom;
    ctx.beginPath(); ctx.moveTo(tl.x, GROUND_Y); ctx.lineTo(br.x, GROUND_Y); ctx.stroke();
    return;
  }
  pathBody(b);
  ctx.fillStyle = cu.color || '#888';
  ctx.fill();
  ctx.lineWidth = 1.5 / camera.zoom;
  ctx.strokeStyle = 'rgba(0,0,0,0.4)';
  ctx.stroke();

  if (cu.type === 'wheel') {
    // hub + spokes so rotation is visible
    ctx.save();
    ctx.translate(b.position.x, b.position.y);
    ctx.rotate(b.angle);
    ctx.strokeStyle = '#8a93a3'; ctx.lineWidth = 3 / camera.zoom;
    for (let i = 0; i < 3; i++) {
      const a = i * Math.PI * 2 / 3;
      ctx.beginPath(); ctx.moveTo(0, 0);
      ctx.lineTo(Math.cos(a) * cu.r * 0.82, Math.sin(a) * cu.r * 0.82); ctx.stroke();
    }
    ctx.beginPath(); ctx.arc(0, 0, cu.r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = '#aeb7c5'; ctx.fill();
    ctx.restore();
  }
}

function drawConstraint(c) {
  if (!c.custom || c.custom.type === 'rope' || !c.bodyA || !c.bodyB) return;
  const pa = localToWorld(c.pointA, c.bodyA);
  const pb = localToWorld(c.pointB, c.bodyB);

  if (c.custom.type === 'pin') {
    // rivet icon at the exact joint location
    const r = 6 / camera.zoom;
    ctx.beginPath(); ctx.arc(pa.x, pa.y, r, 0, Math.PI * 2);
    ctx.fillStyle = '#ff5252'; ctx.fill();
    ctx.lineWidth = 1.5 / camera.zoom; ctx.strokeStyle = '#ffffff'; ctx.stroke();
    ctx.beginPath(); ctx.arc(pa.x, pa.y, r * 0.42, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  } else if (c.custom.type === 'motor') {
    // axle icon: ring + hub + spin arc at the rotor center
    const R = 10 / camera.zoom;
    ctx.beginPath(); ctx.arc(pb.x, pb.y, R, 0, Math.PI * 2);
    ctx.lineWidth = 2.5 / camera.zoom; ctx.strokeStyle = '#ff9800'; ctx.stroke();
    ctx.beginPath(); ctx.arc(pb.x, pb.y, 3.5 / camera.zoom, 0, Math.PI * 2);
    ctx.fillStyle = '#ff9800'; ctx.fill();
    ctx.beginPath(); ctx.arc(pb.x, pb.y, R + 4 / camera.zoom, -0.4, 1.4);
    ctx.lineWidth = 2 / camera.zoom;
    ctx.strokeStyle = 'rgba(255,152,0,0.85)'; ctx.stroke();
  } else if (c.custom.type === 'piston') {
    const mx = (pa.x + pb.x) / 2, my = (pa.y + pb.y) / 2;
    ctx.lineCap = 'round';
    ctx.lineWidth = 7 / camera.zoom; ctx.strokeStyle = '#5b6675';
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(mx, my); ctx.stroke();
    ctx.lineWidth = 4 / camera.zoom; ctx.strokeStyle = '#f0a500';
    ctx.beginPath(); ctx.moveTo(mx, my); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.lineWidth = 1 / camera.zoom;
    for (const q of [pa, pb]) {
      ctx.beginPath(); ctx.arc(q.x, q.y, 3.5 / camera.zoom, 0, Math.PI * 2);
      ctx.fillStyle = '#f0a500'; ctx.fill();
    }
    ctx.lineCap = 'butt';
  }
}

function drawHighlights() {
  const outline = (b, color) => {
    pathBody(b);
    ctx.lineWidth = 2.5 / camera.zoom;
    ctx.strokeStyle = color;
    ctx.stroke();
  };
  if (hoverBody && mode === 'build') outline(hoverBody, 'rgba(255,255,255,0.55)');
  if (selectedBody) outline(selectedBody, '#7dd3fc');

  // armed joint: highlight body, mark the first point, preview line to cursor
  if (pendingJoint) {
    outline(pendingJoint.bodyA, '#22d3ee');
    const a = pendingJoint.pointA;
    ctx.beginPath(); ctx.arc(a.x, a.y, 5 / camera.zoom, 0, Math.PI * 2);
    ctx.lineWidth = 2 / camera.zoom; ctx.strokeStyle = '#22d3ee'; ctx.stroke();
    const mp = screenToWorld(lastMouse.x, lastMouse.y);
    ctx.setLineDash([6 / camera.zoom, 6 / camera.zoom]);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(mp.x, mp.y);
    ctx.strokeStyle = 'rgba(34,211,238,0.7)'; ctx.stroke();
    ctx.setLineDash([]);
  }

  // rope drag preview
  if (ropeDragStart) {
    const p = screenToWorld(lastMouse.x, lastMouse.y);
    ctx.lineWidth = 2 / camera.zoom;
    ctx.setLineDash([6 / camera.zoom, 6 / camera.zoom]);
    ctx.strokeStyle = '#9aa0a6';
    ctx.beginPath();
    ctx.moveTo(ropeDragStart.p.x, ropeDragStart.p.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

let lastMouse = { x: 0, y: 0 };
canvas.addEventListener('mousemove', e => { lastMouse = { x: e.clientX, y: e.clientY }; });

function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0d1117';
  ctx.fillRect(0, 0, cw, ch);

  ctx.save();
  ctx.translate(cw / 2, ch / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  drawGrid();
  for (const b of Composite.allBodies(world)) drawBody(b);
  for (const c of Composite.allConstraints(world)) drawConstraint(c);   // icons on top
  drawHighlights();

  ctx.restore();
}

/* =====================================================================
   12. UI WIRING
===================================================================== */
const HINTS = {
  move: '<b>Move:</b> drag a body (connected clusters move together). Middle/right-drag pans, wheel zooms.',
  rotate: '<b>Rotate:</b> drag on a body — the whole connected cluster rotates rigidly around that body\'s center.',
  resize: '<b>Resize:</b> drag away from / toward a body\'s center to scale it. Mass recalculates automatically.',
  pin: '<b>Pin:</b> fastest way — overlap two parts and <b>click the overlap once</b>. Done! Wheel centers snap automatically. Or click body 1, then body 2.',
  motor: '<b>Motor:</b> <b>click where the wheel overlaps its mount</b> — the axle snaps to the wheel center and the wheel becomes the rotor. Bind drive keys + power.',
  piston: '<b>Piston:</b> click a mount point on body 1, then on body 2 — a dashed preview follows your cursor. Bind extend/retract keys + speed.',
  rope: '<b>Rope:</b> click-drag from one point to another — a chain is generated along the drag. Start/end on bodies to attach.',
  delete: '<b>Delete:</b> click a body (removes its joints) or click a joint line (pin/motor/piston) to remove it.'
};
function setHint(custom) {
  const el = document.getElementById('hint');
  if (custom) { el.innerHTML = custom; return; }
  if (mode === 'play') {
    const motors = Composite.allConstraints(world).filter(c => c.custom && c.custom.type === 'motor');
    const pistons = Composite.allConstraints(world).filter(c => c.custom && c.custom.type === 'piston');
    const parts = [];
    for (const m of motors) parts.push(`Motor: <b>${prettyKey(m.custom.fw)}</b>/<b>${prettyKey(m.custom.bw)}</b>`);
    for (const p of pistons) parts.push(`Piston: <b>${prettyKey(p.custom.extend)}</b>/<b>${prettyKey(p.custom.retract)}</b>`);
    el.innerHTML = '<b>PLAY MODE</b> — ' + (parts.length ? parts.join(' &nbsp;•&nbsp; ') : 'no motors or pistons bound') +
      ' &nbsp;•&nbsp; Click <b>Stop / Build</b> to reset the vehicle.';
  } else {
    el.innerHTML = HINTS[tool] + ' &nbsp;•&nbsp; <b>1–8</b> tools &nbsp;•&nbsp; <b>Space</b> Play/Stop';
  }
}

document.querySelectorAll('#toolbar [data-part]').forEach(btn =>
  btn.addEventListener('click', () => {
    ({ chassis: spawnChassis, box: spawnBox, wheel: spawnWheel })[btn.dataset.part]();
  }));
document.querySelectorAll('#toolbar [data-tool]').forEach(btn =>
  btn.addEventListener('click', () => setTool(btn.dataset.tool)));

document.getElementById('playBtn').addEventListener('click', () => {
  if (mode === 'build') enterPlay(); else exitPlay();
});
document.getElementById('undoBtn').addEventListener('click', undo);
document.getElementById('redoBtn').addEventListener('click', redo);

  if (!confirm('Remove all bodies and joints?')) return;

});
document.getElementById('saveBtn').addEventListener('click', () => {
  const blob = new Blob([serialize()], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'vehicle.json';
  a.click();
  URL.revokeObjectURL(a.href);
});
const fileInput = document.getElementById('fileInput');
document.getElementById('loadBtn').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => {
  const f = fileInput.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    if (loadState(reader.result)) pushHistory(currentSnapshot);
  };
  reader.readAsText(f);
  fileInput.value = '';
});

/* =====================================================================
   13. MAIN LOOP
===================================================================== */
let last = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(now - last, 50);
  last = now;
  if (mode === 'play') {
    applyPlayControls();
    Engine.update(engine, dt);
  }
  render();
}

/* ---------- Boot: restore autosave if present ---------- */
(function boot() {
  let restored = false;
  try {
    const saved = localStorage.getItem('vehicleSandbox.autosave');
    if (saved) restored = loadState(saved);
  } catch (e) {}
  if (!restored) {
    // starter vehicle: chassis + two motorized wheels
    const c = viewCenter();
    const chas = Bodies.rectangle(c.x, c.y, 150, 50, { friction: 0.4, label: 'chassis' });
    registerBody(chas, { type: 'chassis', w: 150, h: 50, color: PALETTE.chassis });
    const w1 = Bodies.circle(c.x - 55, c.y + 45, 26, { friction: 0.9, frictionStatic: 1, restitution: 0.1, label: 'wheel' });
    registerBody(w1, { type: 'wheel', r: 26, color: PALETTE.wheel });
    const w2 = Bodies.circle(c.x + 55, c.y + 45, 26, { friction: 0.9, frictionStatic: 1, restitution: 0.1, label: 'wheel' });
    registerBody(w2, { type: 'wheel', r: 26, color: PALETTE.wheel });
    for (const [wb, off] of [[w1, { x: -55, y: 25 }], [w2, { x: 55, y: 25 }]]) {
      const con = Constraint.create({
        bodyA: chas, bodyB: wb,
        pointA: off, pointB: { x: 0, y: 0 },
        length: 0, stiffness: 1, damping: 0.1
      });
      con.custom = { type: 'motor', fw: 'ArrowRight', bw: 'ArrowLeft', power: 3 };
      Composite.add(world, con);
    }
  }
  recomputeCollisionGroups();
  currentSnapshot = serialize();
  setTool('move');
  requestAnimationFrame(loop);
})();
</script>
